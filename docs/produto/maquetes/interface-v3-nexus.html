<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambiente de Trabalho — v2 (Nexus Aquisição)</title>
<style>
/* ------------------------------------------------------------------
   MOCKUP v2 - evolucao do interface_ilustrativa.html do Pintor.
   Mantem a linguagem visual original. Muda o MODELO:
     1) tela padrao = HOJE (o que trava no humano), nao Kanban
     2) card = OBJETIVO com etapas dentro, nao etapa solta
     3) dependencia = ARTEFATO (o card morre quando o artefato existe)
     4) eixo = momentos humanos (gravar, aprovar, decidir, call)
     5) funciona so com o orquestrador - agentes sao opcionais
   Dados falsos, cenario real: ambiente nexus-aquisicao.
   ------------------------------------------------------------------ */
:root{
  --fundo:#1b1b1b; --painel:#202020; --cartao:#262626; --cartao-alto:#2e2e2e;
  --borda:#3a3a3a; --borda-forte:#4d4d4d; --texto:#d6d6d6; --texto-fraco:#8a8a8a;
  --usuario:#4ec9d9; --agente:#7bc96f; --sistema:#d7b25a; --destaque:#6ea8fe;
  --humano:#e0863f; --travado:#c96f6f; --raio:8px;
  --f-oferta:#b98fe0; --f-instr:#4ec9d9; --f-conteudo:#7bc96f;
  --f-midia:#6ea8fe; --f-outbound:#d7b25a; --f-comercial:#e08fa8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fundo);color:var(--texto);font-family:"Segoe UI",system-ui,sans-serif;
  font-size:14px;height:100vh;overflow:hidden}
.app{display:flex;gap:6px;height:100vh;padding:10px}

/* ============ SIDEBAR ============ */
.sidebar{width:240px;flex:none;display:flex;flex-direction:column;border:1px solid var(--borda);
  border-radius:var(--raio);padding:14px 12px;background:var(--painel);min-height:0}
.sidebar h1{font-size:15px;font-weight:600}
.sidebar h1 small{display:block;font-size:11px;font-weight:400;color:var(--texto-fraco);margin-top:3px}
.sidebar h1 .meta{display:block;font-size:10.5px;color:var(--destaque);margin-top:4px}
.regua{border:none;border-top:1px solid var(--borda);margin:12px 0 14px}
.visoes{display:flex;flex-direction:column}
.visoes button{text-align:left;background:var(--cartao);color:var(--texto);border:1px solid var(--borda-forte);
  padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
.visoes button:first-child{border-radius:var(--raio) var(--raio) 0 0}
.visoes button:last-child{border-radius:0 0 var(--raio) var(--raio)}
.visoes button + button{margin-top:-1px}
.visoes button:hover{background:var(--cartao-alto)}
.visoes button.ativo{border-color:var(--destaque);color:#fff;box-shadow:inset 2px 0 0 var(--destaque)}
.visoes button small{display:block;font-size:10.5px;font-weight:400;color:var(--texto-fraco);margin-top:2px}
.visoes button .badge{float:right;font-size:10px;background:var(--humano);color:#111;border-radius:9px;
  padding:1px 7px;font-weight:700}
.caixa-lateral{margin-top:14px;border:1px solid var(--borda-forte);border-radius:var(--raio);
  background:var(--cartao);display:flex;flex-direction:column;min-height:0}
.cabecalho{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 12px}
.cabecalho .rotulo{flex:1;min-width:0}
.cabecalho .rotulo b{display:block;font-size:13.5px}
.cabecalho .rotulo span{display:block;font-size:11px;color:var(--destaque);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corpo{border-top:1px solid var(--borda);padding:6px;overflow-y:auto}
#caixa-cards{flex:1}
#caixa-cards .corpo{flex:1}
.item{padding:7px 9px;border-radius:5px;font-size:12.5px;color:var(--texto-fraco);cursor:pointer;
  border-left:3px solid transparent;line-height:1.35}
.item:hover{background:var(--cartao-alto);color:var(--texto)}
.item.ativo{background:var(--cartao-alto);color:var(--destaque);font-weight:600}
.item .contagem{float:right;font-size:10.5px;color:var(--texto-fraco);font-weight:400}
.item .sinal{float:right;font-size:10px}
.divisoria{width:4px;flex:none;background-image:radial-gradient(var(--borda) 1px,transparent 1px);
  background-size:4px 8px}

/* ============ PRINCIPAL ============ */
.principal{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.topo-card{border:1px solid var(--borda);border-radius:var(--raio);background:var(--painel);padding:10px 14px}
.topo-card .linha1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.topo-card b{font-size:15px}
.topo-card .frente{font-size:10.5px;border:1px solid var(--borda-forte);border-radius:3px;padding:1px 7px;
  color:var(--texto-fraco)}
.topo-card .objetivo{font-size:11.5px;color:var(--texto-fraco);margin-top:5px;line-height:1.45}
.artefatos{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap;font-size:11px}
.artefatos .bloco b{display:block;font-size:9.5px;letter-spacing:1px;color:var(--texto-fraco);
  font-weight:600;margin-bottom:4px}
.chip{display:inline-block;border:1px solid var(--borda-forte);border-radius:11px;padding:2px 9px;
  margin:0 5px 4px 0;font-size:11px;color:var(--texto-fraco)}
.chip.ok{border-color:var(--agente);color:var(--agente)}
.chip.falta{border-color:var(--travado);color:var(--travado)}
.chip.alvo{border-color:var(--destaque);color:var(--destaque)}

/* regua de etapas */
.regua-etapas{display:flex;align-items:stretch;gap:0;margin-top:11px;overflow-x:auto;padding-bottom:2px}
.etapa{flex:none;border:1px solid var(--borda);border-radius:5px;padding:5px 10px;font-size:11px;
  background:var(--cartao);color:var(--texto-fraco);white-space:nowrap;position:relative;cursor:default}
.etapa + .etapa{margin-left:14px}
.etapa + .etapa:before{content:"";position:absolute;left:-14px;top:50%;width:14px;
  border-top:1px solid var(--borda-forte)}
.etapa.ok{color:var(--agente);border-color:#3d5c39}
.etapa.andando{color:var(--destaque);border-color:var(--destaque);background:#1e2635}
.etapa.espera{color:var(--travado);border-color:var(--travado);border-style:dashed}
.etapa.humano{color:var(--humano);border-color:var(--humano);background:#2a1f14;font-weight:600}
.etapa .quem{display:block;font-size:9px;letter-spacing:.5px;opacity:.75;margin-top:2px}

/* abas */
.abas{display:flex;border:1px solid var(--borda);border-radius:var(--raio);padding:6px;
  background:var(--painel);overflow-x:auto}
.aba{background:transparent;color:var(--texto-fraco);border:1px solid transparent;border-radius:6px;
  padding:8px 16px;font:inherit;cursor:pointer;white-space:nowrap}
.aba:hover{background:var(--cartao)}
.aba.ativa{background:var(--cartao);border-color:var(--borda-forte);color:var(--texto)}
.aba .papel{font-size:10px;color:var(--texto-fraco);margin-left:6px;border:1px solid var(--borda-forte);
  border-radius:3px;padding:1px 5px}
.aba-nova{margin-left:auto;padding:8px 14px;font-size:16px;line-height:1;flex:none}

.caixa{flex:1;display:flex;flex-direction:column;border:1px solid var(--borda);border-radius:var(--raio);
  background:var(--painel);padding:14px;min-height:0}
.miolo{flex:1;display:flex;gap:12px;min-height:0}
.conteudo{flex:1;overflow-y:auto;padding-right:6px;min-width:0}
.escondido{display:none}
</style>
<style>
/* chat */
.msg{margin-bottom:14px;line-height:1.55}
.msg .autor{font-weight:600}
.msg.usuario .autor{color:var(--usuario)}
.msg.agente .autor{color:var(--agente)}
.msg.sistema .autor{color:var(--sistema)}
.msg.sistema .texto{color:var(--sistema);white-space:pre-wrap;font-family:Consolas,monospace;font-size:12.5px}
.msg .texto{display:block;margin-top:3px}
.msg code{background:var(--cartao);padding:1px 5px;border-radius:3px;font-size:12px}
.acao-humana{border:1px solid var(--humano);background:#2a1f14;border-radius:6px;padding:10px 12px;
  margin:6px 0 14px;font-size:12.5px;color:#e8c9a8}
.acao-humana b{color:var(--humano)}
.acao-humana .btns{margin-top:8px;display:flex;gap:8px}
.acao-humana button{background:var(--cartao);color:var(--texto);border:1px solid var(--borda-forte);
  border-radius:5px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.acao-humana button.sim{border-color:var(--humano);color:var(--humano);font-weight:600}
/* memoria */
.memoria{width:265px;flex:none;border-left:1px solid var(--borda);padding-left:12px;overflow-y:auto;font-size:12px}
.memoria.escondida{display:none}
.memoria h3{font-size:10px;letter-spacing:1px;color:var(--texto-fraco);margin-bottom:10px}
.anotacao{background:var(--cartao);border:1px solid var(--borda);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.anotacao .chave{color:var(--destaque);font-weight:600;font-family:Consolas,monospace}
.anotacao .autor{display:block;color:var(--texto-fraco);font-size:10.5px;margin:3px 0 5px}
.anotacao .valor{line-height:1.5}
.vazio{padding:10px;font-size:11.5px;color:var(--texto-fraco);line-height:1.5}
/* HOJE */
.hoje{display:flex;flex-direction:column;gap:16px}
.grupo > .titulo{font-size:10px;letter-spacing:1.4px;color:var(--texto-fraco);margin-bottom:8px}
.grupo.humano > .titulo{color:var(--humano)}
.grupo.travado > .titulo{color:var(--travado)}
.pend{display:flex;align-items:center;gap:10px;background:var(--cartao);border:1px solid var(--borda-forte);
  border-left:3px solid var(--humano);border-radius:6px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.pend:hover{background:var(--cartao-alto);border-color:var(--destaque)}
.pend .tipo{font-size:9.5px;letter-spacing:1px;border:1px solid var(--humano);color:var(--humano);
  border-radius:3px;padding:2px 7px;flex:none;font-weight:600}
.pend .txt{flex:1;font-size:13px;line-height:1.35}
.pend .card-ref{font-size:11px;color:var(--texto-fraco)}
.pend.andou{border-left-color:var(--agente);cursor:default}
.pend.andou .tipo{border-color:var(--agente);color:var(--agente)}
.pend.trv{border-left-color:var(--travado)}
.pend.trv .tipo{border-color:var(--travado);color:var(--travado)}
.nota-modelo{border-left:3px solid var(--sistema);background:var(--cartao);padding:9px 12px;
  border-radius:0 6px 6px 0;font-size:11.5px;color:#bdbdbd;line-height:1.5;margin-top:6px}
.nota-modelo b{color:var(--sistema)}
</style>
<style>
/* CARDS */
.grade{display:flex;gap:12px;height:100%;overflow-x:auto;padding-bottom:6px}
.coluna{width:250px;flex:none;background:var(--fundo);border:1px solid var(--borda);border-radius:var(--raio);
  padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto}
.coluna > .titulo{font-size:10.5px;letter-spacing:.8px;color:var(--texto-fraco);display:flex;
  justify-content:space-between;flex:none}
.card{background:var(--cartao);border:1px solid var(--borda-forte);border-left:3px solid var(--borda-forte);
  border-radius:6px;padding:10px;font-size:12.5px;line-height:1.4;cursor:pointer;flex:none}
.card:hover{background:var(--cartao-alto);border-color:var(--destaque)}
.card.oferta{border-left-color:var(--f-oferta)} .card.instr{border-left-color:var(--f-instr)}
.card.conteudo{border-left-color:var(--f-conteudo)} .card.midia{border-left-color:var(--f-midia)}
.card.outbound{border-left-color:var(--f-outbound)} .card.comercial{border-left-color:var(--f-comercial)}
.card .prod{display:block;margin-top:7px;font-size:10.5px;color:var(--destaque)}
.card .est{display:block;margin-top:5px;font-size:10.5px}
.card .est.voce{color:var(--humano)} .card .est.trv{color:var(--travado)}
.card .est.and{color:var(--agente)} .card .est.pronto{color:var(--texto-fraco)}
.card .barra{display:flex;gap:2px;margin-top:8px}
.card .barra i{height:3px;flex:1;background:var(--borda-forte);border-radius:2px}
.card .barra i.ok{background:var(--agente)} .card .barra i.hum{background:var(--humano)}
.card .barra i.trv{background:var(--travado)}
/* NUMEROS + WIKI */
.tabela{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:18px}
.tabela th,.tabela td{border:1px solid var(--borda);padding:7px 9px;text-align:left}
.tabela th{color:var(--texto-fraco);font-size:10.5px;letter-spacing:.6px;font-weight:600}
.tabela td.n{font-family:Consolas,monospace}
h2.sec{font-size:15px;margin:4px 0 10px}
h3.sec{font-size:12px;color:var(--destaque);margin:16px 0 7px}
.wiki{display:flex;gap:18px;height:100%}
.wiki-indice{width:210px;flex:none;border-right:1px solid var(--borda);padding-right:12px;overflow-y:auto}
.wiki-indice .titulinho{font-size:10px;letter-spacing:1px;color:var(--texto-fraco);padding:0 8px 8px}
.wiki-indice .pagina{padding:7px 8px;border-radius:5px;color:var(--texto-fraco);cursor:pointer;font-size:12.5px}
.wiki-indice .pagina:hover{background:var(--cartao);color:var(--texto)}
.wiki-indice .pagina.ativo{background:var(--cartao);color:var(--texto);font-weight:600}
.wiki-texto{flex:1;line-height:1.7;max-width:76ch;overflow-y:auto;padding-right:8px}
.wiki-texto h2{font-size:18px;margin-bottom:4px}
.wiki-texto .meta{color:var(--texto-fraco);font-size:11px;margin-bottom:16px}
.wiki-texto h3{font-size:13px;margin:18px 0 6px;color:var(--destaque)}
.wiki-texto p,.wiki-texto li{color:#c2c2c2}
.wiki-texto p{margin-bottom:10px}
.wiki-texto ul{margin:0 0 12px 18px}
.wiki-texto li{margin-bottom:5px}
/* status + prompt */
.status{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--texto-fraco);
  border-top:1px solid var(--borda);margin-top:10px;padding-top:8px;font-family:Consolas,monospace}
.status .caminho{color:var(--texto)}
.status button{background:var(--cartao);color:var(--texto-fraco);border:1px solid var(--borda-forte);
  border-radius:4px;padding:3px 9px;font:inherit;cursor:pointer;flex:none;margin-left:auto}
.status button:hover{color:var(--texto)}
.prompt{margin-top:12px;display:flex;align-items:center;border:1px solid var(--borda-forte);
  border-radius:var(--raio);background:var(--cartao);padding:12px 14px}
.prompt input{flex:1;background:transparent;border:none;outline:none;color:var(--texto);font:inherit}
.prompt input::placeholder{color:var(--texto-fraco)}
.prompt .dica{color:var(--texto-fraco);font-size:11px;font-family:Consolas,monospace}
</style>
<style>
/* ---- v3: as tres naturezas de tarefa ---- */
:root{--n-exec:#6ea8fe;--n-analise:#d7b25a;--n-disc:#b98fe0}
.selo-nat{font-size:9.5px;letter-spacing:1.2px;font-weight:700;border-radius:3px;padding:2px 8px;
  border:1px solid var(--borda-forte);color:var(--texto-fraco)}
.selo-nat.execucao{border-color:var(--n-exec);color:var(--n-exec)}
.selo-nat.analise{border-color:var(--n-analise);color:var(--n-analise)}
.selo-nat.discovery{border-color:var(--n-disc);color:var(--n-disc)}
.selo-nat.recorrente{border-color:var(--agente);color:var(--agente)}
.destino{font-size:10.5px;color:var(--texto-fraco);margin-top:7px}
.destino b{color:var(--texto)}
.leitura{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.leitura .dado{border:1px solid var(--borda);background:var(--cartao);border-radius:6px;padding:6px 10px;
  font-size:11px;min-width:112px}
.leitura .dado span{display:block;font-size:9.5px;letter-spacing:.8px;color:var(--texto-fraco);margin-bottom:3px}
.leitura .dado b{font-family:Consolas,monospace;font-size:13px}
.leitura .dado.ruim b{color:var(--travado)} .leitura .dado.bom b{color:var(--agente)}
.pend.dec{border-left-color:var(--n-analise)}
.pend.dec .tipo{border-color:var(--n-analise);color:var(--n-analise)}
.veredito{border:1px solid var(--n-analise);background:#2a2415;border-radius:6px;padding:10px 12px;
  margin:6px 0 14px;font-size:12.5px;color:#e6d5a8}
.veredito b{color:var(--n-analise)}
.veredito .btns{margin-top:8px;display:flex;gap:8px}
.veredito button{background:var(--cartao);color:var(--texto);border:1px solid var(--borda-forte);
  border-radius:5px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.veredito button.sim{border-color:var(--n-analise);color:var(--n-analise);font-weight:600}
.diretriz{border:1px solid var(--n-disc);background:#241d2b;border-radius:6px;padding:10px 12px;
  margin:6px 0 14px;font-size:12.5px;color:#d9c7ea}
.diretriz b{color:var(--n-disc)}
.diretriz .btns{margin-top:8px;display:flex;gap:8px}
.diretriz button{background:var(--cartao);color:var(--texto);border:1px solid var(--borda-forte);
  border-radius:5px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.diretriz button.sim{border-color:var(--n-disc);color:var(--n-disc);font-weight:600}
/* paleta de comandos */
.paleta{position:absolute;bottom:64px;right:14px;width:430px;background:var(--painel);
  border:1px solid var(--borda-forte);border-radius:var(--raio);padding:12px;z-index:9;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.paleta.escondida{display:none}
.paleta h4{font-size:10px;letter-spacing:1.2px;color:var(--texto-fraco);margin:0 0 8px}
.paleta .cmd{display:flex;gap:9px;align-items:baseline;padding:5px 7px;border-radius:5px;font-size:12px}
.paleta .cmd:hover{background:var(--cartao)}
.paleta .cmd code{font-family:Consolas,monospace;color:var(--destaque);min-width:88px}
.paleta .cmd small{color:var(--texto-fraco);font-size:10.5px}
.paleta .cmd .conf{margin-left:auto;font-size:9.5px;color:var(--humano);border:1px solid var(--humano);
  border-radius:3px;padding:1px 6px;white-space:nowrap}
.paleta .grupo-cmd{margin-bottom:10px}
.caixa{position:relative}
.prompt .dica{cursor:pointer}
.prompt .dica:hover{color:var(--destaque)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Ambiente<small>nexus-aquisicao</small>
      <span class="meta">meta +R$42k MRR · 6 meses · R$7k/mes</span></h1>
    <hr class="regua">
    <div class="visoes">
      <button data-visao="hoje">HOJE<span class="badge" id="badge-hoje">4</span><small>o que trava em voce</small></button>
      <button data-visao="cards">CARDS<small>objetivos vivos</small></button>
      <button data-visao="numeros">NUMEROS<small>CPL, CAC, gasto</small></button>
      <button data-visao="wiki">WIKI<small>o que vale em todo card</small></button>
    </div>
    <div class="caixa-lateral">
      <div class="cabecalho"><div class="rotulo"><b>Frente</b><span id="frente-ativa">midia</span></div></div>
      <div class="corpo" id="lista-frentes"></div>
    </div>
    <div class="caixa-lateral" id="caixa-cards">
      <div class="cabecalho"><div class="rotulo"><b>Cards da frente</b></div></div>
      <div class="corpo" id="lista-cards"></div>
    </div>
  </aside>
  <div class="divisoria"></div>
  <main class="principal">
    <div class="topo-card" id="topo"></div>
    <div class="abas" id="abas"></div>
    <section class="caixa">
      <div class="miolo">
        <div class="conteudo">
          <div class="visao" id="visao-card"></div>
          <div class="visao escondido" id="visao-hoje"></div>
          <div class="visao escondido" id="visao-cards"></div>
          <div class="visao escondido" id="visao-numeros"></div>
          <div class="visao escondido" id="visao-wiki"></div>
        </div>
        <aside class="memoria escondida" id="memoria"></aside>
      </div>
      <div class="status">
        <span class="caminho" id="caminho"></span><span id="metricas"></span>
        <button id="btn-memoria">mostrar memoria</button>
      </div>
      <div class="paleta escondida" id="paleta"></div>
      <div class="prompt">
        <input type="text" placeholder="Fale com o orquestrador...">
        <span class="dica" id="dica-cmd">/ para comandos</span>
      </div>
    </section>
  </main>
</div>
<script>
/* ==========================================================
   v3 - acrescenta AS TRES NATUREZAS DE TAREFA:

/* ============ TOPO — muda conforme a NATUREZA ============ */
function pintarTopo(){
  const c=card(), N=NATUREZAS[c.natureza];
  const et=c.etapas.map(e=>{
    const cl=e.humano?"humano":e.e==="ok"?"ok":(e.e==="andando"||e.e==="agora")?"andando":e.e==="espera"?"espera":"";
    const m=e.e==="ok"?"✓ ":e.e==="agora"?"◆ ":e.e==="espera"?"⏸ ":"";
    return `<div class="etapa ${cl}">${m}${e.n}<span class="quem">${e.q}</span></div>`;}).join("");
  let miolo="";
  if(c.natureza==="execucao"){
    const cons=c.consome.length?c.consome.map(a=>
      `<span class="chip ${a.ok?"ok":"falta"}">${a.ok?"✓":"⏸"} ${a.o}</span>`).join("")
      :`<span class="chip">nada — card de origem</span>`;
    miolo=`<div class="artefatos"><div class="bloco"><b>CONSOME</b>${cons}</div>
      <div class="bloco"><b>PRODUZ — peca no mundo</b><span class="chip alvo">◎ ${c.produz}</span></div></div>`;
  }else if(c.natureza==="analise"){
    const dados=(c.le||[]).map(d=>`<div class="dado ${d.c}"><span>${d.r}</span><b>${d.v}</b></div>`).join("");
    miolo=`<div class="leitura">${dados}</div>
      <div class="artefatos"><div class="bloco"><b>PRODUZ — decisao</b>
      <span class="chip alvo">◎ ${c.produz}</span></div></div>`;
  }else{
    const f=(c.fontes||[]).map(x=>`<span class="chip">${x}</span>`).join("");
    miolo=`<div class="artefatos"><div class="bloco"><b>HIPOTESE</b>
      <div style="font-size:12px;color:#c2c2c2;line-height:1.5;max-width:78ch">${c.hipotese||"—"}</div></div></div>
      <div class="artefatos"><div class="bloco"><b>FONTES</b>${f}</div>
      <div class="bloco"><b>PRODUZ — diretriz</b><span class="chip alvo">◎ ${c.produz}</span></div></div>`;
  }
  $("topo").innerHTML=`
    <div class="linha1"><b>${c.titulo}</b>
      <span class="selo-nat ${c.natureza}">${N.rotulo}</span>
      ${c.recorrente?`<span class="selo-nat recorrente">RECORRENTE — nao fecha</span>`:""}
      <span class="frente">${FRENTES.find(f=>f.id===c.frente).nome}</span>
      <span class="frente">${ROTULO[c.estado]}${c.espera?" · "+c.espera:""}</span></div>
    <div class="objetivo">${c.objetivo}</div>
    <div class="destino">natureza <b>${N.rotulo}</b> — ${N.destino}</div>
    ${miolo}
    <div class="regua-etapas">${et}</div>`;
}

  $("paleta").innerHTML=COMANDOS.map(g=>`<div class="grupo-cmd"><h4>${g.grupo}</h4>
    ${g.itens.map(i=>`<div class="cmd"><code>${i.v}</code><small>${i.d}</small>
      ${i.conf?`<span class="conf">confirma: ${i.conf}</span>`:""}</div>`).join("")}</div>`).join("")+
    `<div class="nota-modelo" style="margin:0;font-size:11px">Os 10 verbos nao viraram tipos de card —
     viraram comandos. <b>Verbo que toca o mundo real pede confirmacao; verbo que so produz rascunho, nao.</b></div>`;
}

/* ============ VISAO / EVENTOS ============ */
function pintarVisao(){
  document.querySelectorAll(".visao").forEach(v=>v.classList.add("escondido"));
  $("visao-"+visao).classList.remove("escondido");
  document.querySelectorAll(".visoes button").forEach(b=>
    b.classList.toggle("ativo",b.dataset.visao===visao));
  const soCard=visao==="card";
  $("topo").style.display=soCard?"":"none";
  $("abas").style.display=soCard?"":"none";
}
function pintarTudo(){
  pintarFrentes();pintarListaCards();pintarTopo();pintarAbas();pintarConversa();pintarMemoria();
  pintarStatus();pintarHoje();pintarCards();pintarNumeros();pintarWiki();pintarPaleta();pintarVisao();
}
function abrirCard(id){
  idCard=id;iAba=0;visao="card";
  iFrente=FRENTES.findIndex(f=>f.id===card().frente);
  pintarTudo();
}
document.querySelectorAll(".visoes button").forEach(b=>{
  b.onclick=()=>{visao=(visao===b.dataset.visao)?"card":b.dataset.visao;pintarVisao();};});
$("lista-frentes").onclick=e=>{
  const a=e.target.closest("[data-frente]");if(!a)return;
  iFrente=+a.dataset.frente;const l=cardsDaFrente();
  if(l.length)abrirCard(l[0].id);else{pintarFrentes();pintarListaCards();}};
$("lista-cards").onclick=e=>{
  const a=e.target.closest("[data-card]");if(!a)return;abrirCard(a.dataset.card);};
$("abas").onclick=e=>{
  const a=e.target.closest("[data-aba]");if(!a)return;
  iAba=+a.dataset.aba;visao="card";pintarAbas();pintarConversa();pintarStatus();pintarVisao();};
["visao-hoje","visao-cards"].forEach(v=>{
  $(v).onclick=e=>{const a=e.target.closest("[data-ir]");if(a)abrirCard(a.dataset.ir);};});
$("visao-wiki").onclick=e=>{
  const a=e.target.closest("[data-wiki]");if(!a)return;iWiki=+a.dataset.wiki;pintarWiki();};
$("btn-memoria").onclick=()=>{
  const m=$("memoria");m.classList.toggle("escondida");
  $("btn-memoria").textContent=m.classList.contains("escondida")?"mostrar memoria":"ocultar memoria";};
$("dica-cmd").onclick=()=>$("paleta").classList.toggle("escondida");

pintarTudo();
</script>
