<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FishingRod — Interface Ilustrativa</title>
<style>
/* ------------------------------------------------------------------
   MOCKUP ILUSTRATIVO - nada aqui e' o sistema de verdade.
   O JS do fim do arquivo so redesenha a tela a partir de dados falsos.
   Cenario: ambiente comercial da Anexo (conteudo, midia, CRO, outbound).
   ------------------------------------------------------------------ */
:root{
  --fundo:        #1b1b1b;
  --painel:       #202020;
  --cartao:       #262626;
  --cartao-alto:  #2e2e2e;
  --borda:        #3a3a3a;
  --borda-forte:  #4d4d4d;
  --texto:        #d6d6d6;
  --texto-fraco:  #8a8a8a;
  --usuario:      #4ec9d9;
  --agente:       #7bc96f;
  --sistema:      #d7b25a;
  --destaque:     #6ea8fe;
  --raio:         8px;

  /* uma cor por fluxo de trabalho do cliente */
  --f-conteudo:   #7bc96f;
  --f-midia:      #6ea8fe;
  --f-cro:        #d7b25a;
  --f-outbound:   #4ec9d9;
  --f-relacao:    #b98fe0;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--fundo);
  color:var(--texto);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px;
  height:100vh;
  overflow:hidden;
}

.app{
  display:flex;
  gap:6px;
  height:100vh;
  padding:10px;
}

/* ===================== SIDEBAR ===================== */
.sidebar{
  width:225px;
  flex:none;
  display:flex;
  flex-direction:column;
  border:1px solid var(--borda);
  border-radius:var(--raio);
  padding:14px 12px;
  background:var(--painel);
  min-height:0;
}

.sidebar h1{font-size:15px;font-weight:600;letter-spacing:.2px}
.sidebar h1 small{
  display:block;
  font-size:11px;
  font-weight:400;
  color:var(--texto-fraco);
  margin-top:3px;
}

.regua{border:none;border-top:1px solid var(--borda);margin:12px 0 14px}

/* --- Semana / Kanban / WIKI: botoes colados --- */
.visoes{display:flex;flex-direction:column}
.visoes button{
  text-align:left;
  background:var(--cartao);
  color:var(--texto);
  border:1px solid var(--borda-forte);
  padding:9px 12px;
  font:inherit;
  font-weight:600;
  cursor:pointer;
}
.visoes button:first-child{border-radius:var(--raio) var(--raio) 0 0}
.visoes button:last-child{border-radius:0 0 var(--raio) var(--raio)}
.visoes button + button{margin-top:-1px}
.visoes button:hover{background:var(--cartao-alto)}
.visoes button.ativo{
  border-color:var(--destaque);
  color:#fff;
  box-shadow:inset 2px 0 0 var(--destaque);
}
.visoes button small{
  display:block;font-size:10.5px;font-weight:400;color:var(--texto-fraco);margin-top:2px;
}

/* --- caixas de Projetos e Sessoes --- */
.caixa-lateral{
  margin-top:14px;
  border:1px solid var(--borda-forte);
  border-radius:var(--raio);
  background:var(--cartao);
  display:flex;
  flex-direction:column;
  min-height:0;
}

.cabecalho{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 8px 10px 12px;
}
.cabecalho .rotulo{flex:1;min-width:0}
.cabecalho .rotulo b{display:block;font-size:13.5px;font-weight:600}
.cabecalho .rotulo span{
  display:block;
  font-size:11px;
  color:var(--destaque);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:2px;
}

.chevron{
  flex:none;
  width:28px;
  height:28px;
  background:var(--cartao-alto);
  color:var(--texto-fraco);
  border:1px solid var(--borda-forte);
  border-radius:6px;
  font:inherit;
  font-size:11px;
  cursor:pointer;
  transition:transform .15s;
}
.chevron:hover{color:var(--texto)}
.caixa-lateral.aberta .chevron{transform:rotate(180deg)}

.corpo{
  border-top:1px solid var(--borda);
  padding:6px;
  overflow-y:auto;
}
.caixa-lateral:not(.aberta) .corpo.dropdown{display:none}

.item{
  padding:7px 9px;
  border-radius:5px;
  font-size:12.5px;
  color:var(--texto-fraco);
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  border-left:3px solid transparent;
}
.item:hover{background:var(--cartao-alto);color:var(--texto)}
.item.ativo{background:var(--cartao-alto);color:var(--destaque);font-weight:600}
.item .contagem{float:right;font-size:10.5px;color:var(--texto-fraco);font-weight:400}

#caixa-sessoes{flex:1}
#caixa-sessoes .corpo{flex:1}
.vazio{padding:10px;font-size:11.5px;color:var(--texto-fraco);line-height:1.5}

.divisoria{
  width:4px;
  flex:none;
  background-image:radial-gradient(var(--borda) 1px,transparent 1px);
  background-size:4px 8px;
}

/* ===================== PAINEL PRINCIPAL ===================== */
.principal{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}

/* --- de qual card do Kanban esta sessao nasceu --- */
.origem{
  font-size:11.5px;
  color:var(--texto-fraco);
  padding:0 4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.origem b{color:var(--texto);font-weight:600}

/* --- abas = chats da sessao selecionada --- */
.abas{
  display:flex;
  border:1px solid var(--borda);
  border-radius:var(--raio);
  padding:6px;
  background:var(--painel);
  overflow-x:auto;
}
.aba{
  background:transparent;
  color:var(--texto-fraco);
  border:1px solid transparent;
  border-radius:6px;
  padding:8px 16px;
  font:inherit;
  cursor:pointer;
  white-space:nowrap;
}
.aba:hover{background:var(--cartao)}
.aba.ativa{background:var(--cartao);border-color:var(--borda-forte);color:var(--texto)}
.aba .papel{
  font-size:10px;
  color:var(--texto-fraco);
  margin-left:6px;
  border:1px solid var(--borda-forte);
  border-radius:3px;
  padding:1px 5px;
}
.aba-nova{margin-left:auto;padding:8px 14px;font-size:16px;line-height:1;flex:none}

/* --- caixa grande: conteudo + prompt --- */
.caixa{
  flex:1;
  display:flex;
  flex-direction:column;
  border:1px solid var(--borda);
  border-radius:var(--raio);
  background:var(--painel);
  padding:14px;
  min-height:0;
}

.miolo{flex:1;display:flex;gap:12px;min-height:0}
.conteudo{flex:1;overflow-y:auto;padding-right:6px;min-width:0}
.visao{height:100%}
#visao-chat{height:auto}

/* --- visao CHAT --- */
.msg{margin-bottom:14px;line-height:1.55}
.msg .autor{font-weight:600}
.msg.usuario .autor{color:var(--usuario)}
.msg.agente  .autor{color:var(--agente)}
.msg.sistema .autor{color:var(--sistema)}
.msg.sistema .texto{color:var(--sistema);white-space:pre-wrap;font-family:Consolas,monospace;font-size:12.5px}
.msg .texto{display:block;margin-top:3px}
.msg code{background:var(--cartao);padding:1px 5px;border-radius:3px;font-size:12px}

/* --- painel lateral da memoria (blackboard da sessao) --- */
.memoria{
  width:255px;
  flex:none;
  border-left:1px solid var(--borda);
  padding-left:12px;
  overflow-y:auto;
  font-size:12px;
}
.memoria.escondida{display:none}
.memoria h3{font-size:10px;letter-spacing:1px;color:var(--texto-fraco);margin-bottom:10px}
.anotacao{
  background:var(--cartao);
  border:1px solid var(--borda);
  border-radius:6px;
  padding:8px 10px;
  margin-bottom:8px;
}
.anotacao .chave{color:var(--destaque);font-weight:600;font-family:Consolas,monospace}
.anotacao .autor{display:block;color:var(--texto-fraco);font-size:10.5px;margin:3px 0 5px}
.anotacao .valor{line-height:1.5}

/* --- visao WIKI --- */
.wiki{display:flex;gap:18px;height:100%}
.wiki-indice{width:200px;flex:none;border-right:1px solid var(--borda);padding-right:12px;overflow-y:auto}
.wiki-indice .titulinho{
  font-size:10px;letter-spacing:1px;color:var(--texto-fraco);padding:0 8px 8px;
}
.wiki-indice div.pagina{padding:7px 8px;border-radius:5px;color:var(--texto-fraco);cursor:pointer;font-size:12.5px}
.wiki-indice div.pagina:hover{background:var(--cartao);color:var(--texto)}
.wiki-indice div.pagina.ativo{background:var(--cartao);color:var(--texto);font-weight:600}
.wiki-texto{flex:1;line-height:1.7;max-width:74ch;overflow-y:auto;padding-right:8px}
.wiki-texto h2{font-size:18px;margin-bottom:4px}
.wiki-texto .meta{color:var(--texto-fraco);font-size:11px;margin-bottom:16px}
.wiki-texto h3{font-size:13px;margin:18px 0 6px;color:var(--destaque)}
.wiki-texto p{margin-bottom:10px;color:#c2c2c2}
.wiki-texto ul{margin:0 0 12px 18px;color:#c2c2c2}
.wiki-texto li{margin-bottom:5px}
.wiki-texto code{background:var(--cartao);padding:1px 5px;border-radius:3px;font-size:12px}
.nota{
  border-left:3px solid var(--sistema);
  background:var(--cartao);
  padding:9px 12px;
  border-radius:0 6px 6px 0;
  font-size:12.5px;
  color:#c2c2c2;
  margin:14px 0;
}

/* --- visao KANBAN --- */
.quadro{display:flex;flex-direction:column;height:100%;gap:10px;min-height:0}
.legenda{
  font-size:11.5px;color:var(--texto-fraco);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.legenda .pino{display:inline-flex;align-items:center;gap:5px}
.legenda .bola{width:8px;height:8px;border-radius:50%;display:inline-block}

.kanban{display:flex;gap:14px;flex:1;min-height:0;overflow-x:auto;padding-bottom:6px}
.faixa{display:flex;flex-direction:column;gap:8px;min-height:0}
.faixa > .rotulo-faixa{
  font-size:10px;letter-spacing:1.5px;color:var(--texto-fraco);
  border:1px dashed var(--borda-forte);border-radius:5px;
  padding:5px 10px;text-align:center;flex:none;
}
.faixa.eixo > .rotulo-faixa{
  color:var(--sistema);border-color:var(--sistema);border-style:solid;font-weight:600;
}
.faixa .colunas{display:flex;gap:10px;flex:1;min-height:0}

.coluna{
  width:212px;
  flex:none;
  background:var(--fundo);
  border:1px solid var(--borda);
  border-radius:var(--raio);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-height:0;
  overflow-y:auto;
}
.faixa.eixo .coluna{border-color:var(--sistema);background:#211d15}

.coluna > .titulo{
  font-size:10.5px;
  letter-spacing:.8px;
  color:var(--texto-fraco);
  display:flex;
  justify-content:space-between;
  gap:6px;
  flex:none;
}

.card{
  background:var(--cartao);
  border:1px solid var(--borda-forte);
  border-left:3px solid var(--borda-forte);
  border-radius:6px;
  padding:9px 10px;
  font-size:12.5px;
  line-height:1.4;
  cursor:pointer;
  flex:none;
}
.card:hover{background:var(--cartao-alto);border-color:var(--destaque)}
.card.conteudo{border-left-color:var(--f-conteudo)}
.card.midia   {border-left-color:var(--f-midia)}
.card.cro     {border-left-color:var(--f-cro)}
.card.outbound{border-left-color:var(--f-outbound)}
.card.relacao {border-left-color:var(--f-relacao)}

.card .selo{
  display:block;margin-top:6px;font-size:10.5px;color:var(--sistema);
}
.card .elo{
  display:block;margin-top:5px;font-size:10.5px;color:var(--destaque);
}
.card .rodape{
  display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;
  font-size:10px;color:var(--texto-fraco);
}
.card .dia{border:1px solid var(--borda-forte);border-radius:3px;padding:1px 5px;text-transform:uppercase}
.card .abrir{white-space:nowrap}
.card:hover .abrir{color:var(--destaque)}
.card.ativa-sessao .abrir{color:var(--agente)}

/* --- visao SEMANA --- */
.semana{display:flex;flex-direction:column;gap:12px;height:100%;min-height:0}
.semana .intro{font-size:12px;color:var(--texto-fraco);line-height:1.5}
.regua-semana{display:flex;gap:8px;flex:1;min-height:0;overflow-x:auto}
.dia-col{
  flex:1;min-width:132px;
  background:var(--fundo);
  border:1px solid var(--borda);
  border-radius:var(--raio);
  padding:10px;
  display:flex;flex-direction:column;gap:6px;min-height:0;
  overflow-y:auto;
}
.dia-col.eixo{border-color:var(--sistema);background:#211d15}
.dia-col.calmo{opacity:.6}
.dia-col .nome{font-size:10px;letter-spacing:1.2px;color:var(--texto-fraco);flex:none}
.dia-col.eixo .nome{color:var(--sistema)}
.dia-col .foco{font-size:12.5px;font-weight:600;line-height:1.35;margin-bottom:4px;flex:none}
.mini{
  border-left:3px solid var(--borda-forte);
  background:var(--cartao);
  border-radius:0 5px 5px 0;
  padding:6px 8px;
  font-size:11.5px;
  line-height:1.35;
  cursor:pointer;
  flex:none;
}
.mini:hover{background:var(--cartao-alto)}
.mini.conteudo{border-left-color:var(--f-conteudo)}
.mini.midia   {border-left-color:var(--f-midia)}
.mini.cro     {border-left-color:var(--f-cro)}
.mini.outbound{border-left-color:var(--f-outbound)}
.mini.relacao {border-left-color:var(--f-relacao)}
.mini.acao{border-left-color:var(--destaque);color:var(--destaque)}

.continuos{
  border:1px dashed var(--borda-forte);
  border-radius:var(--raio);
  padding:10px 12px;
  flex:none;
}
.continuos .titulo{font-size:10px;letter-spacing:1.2px;color:var(--texto-fraco);margin-bottom:8px}
.continuos .fila{display:flex;gap:8px;flex-wrap:wrap}
.continuos .fila .mini{flex:1;min-width:170px}

/* --- barra de status --- */
.status{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:11.5px;
  color:var(--texto-fraco);
  border-top:1px solid var(--borda);
  margin-top:10px;
  padding-top:8px;
  font-family:Consolas,monospace;
}
.status .caminho{color:var(--texto)}
.status button{
  margin-left:auto;
  background:var(--cartao);
  color:var(--texto-fraco);
  border:1px solid var(--borda-forte);
  border-radius:4px;
  padding:3px 9px;
  font:inherit;
  cursor:pointer;
  flex:none;
}
.status button:hover{color:var(--texto)}

/* --- caixa de prompt --- */
.prompt{
  margin-top:12px;
  display:flex;
  align-items:center;
  border:1px solid var(--borda-forte);
  border-radius:var(--raio);
  background:var(--cartao);
  padding:12px 14px;
}
.prompt input{flex:1;background:transparent;border:none;outline:none;color:var(--texto);font:inherit}
.prompt input::placeholder{color:var(--texto-fraco)}
.prompt .dica{color:var(--texto-fraco);font-size:11px;font-family:Consolas,monospace}

.escondido{display:none}
</style>
</head>
<body>

<div class="app">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <h1>Ambiente<small>comercial-anexo</small></h1>
    <hr class="regua">

    <div class="visoes">
      <button data-visao="semana">Semana<small>o ritmo: dom → sáb</small></button>
      <button data-visao="kanban">Kanban<small>pré / gravação / pós</small></button>
      <button data-visao="wiki">WIKI<small>o que vale em todo projeto</small></button>
    </div>

    <!-- dropdown: abre, escolhe o projeto, fecha -->
    <div class="caixa-lateral" id="caixa-projetos">
      <div class="cabecalho">
        <div class="rotulo">
          <b>Projetos</b>
          <span id="projeto-ativo">conteudo-e-criativos</span>
        </div>
        <button class="chevron" id="btn-projetos" title="abrir lista de projetos">v</button>
      </div>
      <div class="corpo dropdown" id="lista-projetos"></div>
    </div>

    <!-- sessoes do projeto selecionado -->
    <div class="caixa-lateral" id="caixa-sessoes">
      <div class="cabecalho">
        <div class="rotulo"><b>Sessões</b></div>
      </div>
      <div class="corpo" id="lista-sessoes"></div>
    </div>
  </aside>

  <div class="divisoria"></div>

  <!-- ===================== PAINEL PRINCIPAL ===================== -->
  <main class="principal">

    <div class="origem" id="origem"></div>
    <div class="abas" id="abas"></div>

    <section class="caixa">
      <div class="miolo">
        <div class="conteudo">

          <!-- ---------- VISAO: CHAT ---------- -->
          <div class="visao" id="visao-chat"></div>

          <!-- ---------- VISAO: SEMANA ---------- -->
          <div class="visao escondido" id="visao-semana"></div>

          <!-- ---------- VISAO: KANBAN ---------- -->
          <div class="visao escondido" id="visao-kanban"></div>

          <!-- ---------- VISAO: WIKI ---------- -->
          <div class="visao escondido" id="visao-wiki"></div>

        </div>

        <!-- blackboard da sessao, ligado/desligado pela barra de status -->
        <aside class="memoria escondida" id="memoria"></aside>
      </div>

      <div class="status">
        <span class="caminho" id="caminho"></span>
        <span id="metricas"></span>
        <button id="btn-memoria">mostrar memória</button>
      </div>

      <div class="prompt">
        <input type="text" placeholder="Digite seu prompt...." aria-label="prompt">
        <span class="dica">/ para comandos</span>
      </div>
    </section>
  </main>
</div>

<script>
/* ==================================================================
   DADOS FALSOS, so para a tela ter o que pintar.
   Cenario: rotina comercial da Anexo descrita pelo cliente.
   ================================================================== */

/* ------------------ PROJETOS = os fluxos de trabalho ------------------ */
const PROJETOS = [
  {
    nome: "conteudo-e-criativos",
    fluxo: "conteudo",
    orquestrador: "orquestrador-conteudo",
    sessoes: [
      {
        nome: "serie-agencia-nao-escala",
        tarefa: "Série «agência não escala» — 4 roteiros",
        iteracoes: 9,
        chats: [
          {nome:"orquestrador-conteudo", papel:"orquestrador"},
          {nome:"curador-de-temas",      papel:"sub-agente"},
          {nome:"roteirista",            papel:"sub-agente"},
          {nome:"diretor-de-gravacao",   papel:"sub-agente"}
        ],
        memoria: [
          {chave:"angulo-da-serie",  autor:"curador-de-temas",   valor:"Dor escolhida: o dono é o gargalo, a agência trava no operacional. Preço fica fora — a WIKI marca isso como assunto de fundo de funil."},
          {chave:"provas-liberadas", autor:"curador-de-temas",   valor:"Só o case Marlon (3x lead em 60 dias) está autorizado. Os outros dois seguem sem liberação de uso."},
          {chave:"formato",          autor:"roteirista",         valor:"4 vídeos de 60-90s, câmera na mão, sem teleprompter. Gancho de dor nos 3 primeiros segundos."},
          {chave:"pedido-de-pagina", autor:"roteirista",         valor:"Vídeo 2 fecha em oferta de diagnóstico. Abri card de LP dedicada no projeto paginas-cro."},
          {chave:"ordem-de-gravacao",autor:"diretor-de-gravacao",valor:"Terça: gravar 2 e 4 primeiro (mesma roupa, mesma luz). 1 e 3 depois."}
        ]
      },
      {
        nome: "cortes-do-bruto-14",
        tarefa: "Bruto #14 — tirar 6 cortes sem regravar",
        iteracoes: 4,
        chats: [
          {nome:"orquestrador-conteudo", papel:"orquestrador"},
          {nome:"editor-de-cortes",      papel:"sub-agente"}
        ],
        memoria: [
          {chave:"reaproveitamento", autor:"editor-de-cortes", valor:"O bruto #14 já rendeu 3 cortes. Restam 2 blocos aproveitáveis: 04:12-05:30 e 11:40-12:20."},
          {chave:"sem-regravacao",   autor:"orquestrador-conteudo", valor:"Esta tarefa entrou direto no pós-gravação. Nada aqui volta para a terça."}
        ]
      }
    ]
  },
  {
    nome: "midia-paga",
    fluxo: "midia",
    orquestrador: "orquestrador-midia",
    sessoes: [
      {
        nome: "campanha-diagnostico",
        tarefa: "Subir campanha do diagnóstico — 3 criativos",
        iteracoes: 6,
        chats: [
          {nome:"orquestrador-midia",    papel:"orquestrador"},
          {nome:"copy-de-criativo",      papel:"sub-agente"},
          {nome:"analista-de-campanha",  papel:"sub-agente"}

    {tipo:"agente",  autor:"OrquestradorCro", texto:"Por isso o projeto de páginas fica separado mas os cards chegam de fora. Quem está esperando esta página: <code>midia-paga</code>. Prioridade da quinta."}
  ],
  "lp-diagnostico/copy-de-pagina": [
    {tipo:"sistema", autor:"comando", texto:"Chat aberto · WIKI carregada · memória da sessão (1 anotação)"},
    {tipo:"agente",  autor:"CopyDePagina", texto:"Peguei o gancho do vídeo 2 e usei a frase exata como título da página. É a regra que está na WIKI de CRO — quando o título muda, a conversão cai pela metade."},
    {tipo:"usuario", autor:"cliente", texto:"e o resto da página?"},
    {tipo:"agente",  autor:"CopyDePagina", texto:"Dor, método em 3 passos, prova do Marlon (a única liberada) e o diagnóstico como única ação. Sem preço — a WIKI marca preço como fundo de funil."}
  ],
  "lp-diagnostico/analista-de-conversao": [
    {tipo:"sistema", autor:"comando", texto:"Chat aberto · memória da sessão (3 anotações)"},
    {tipo:"agente",  autor:"AnalistaDeConversao", texto:"Comparando com a LP-metodo: página dedicada por criativo converteu mais mesmo com menos volume. Vale promover esse achado para a WIKI, aí todos os projetos passam a assumir isso como padrão."}
  ],

  "cadencia-de-mensagens/orquestrador-outbound": [
    {tipo:"sistema", autor:"comando", texto:"Sessão aberta a partir do card «Cadência de mensagens ativas — 40 contas»"},
    {tipo:"agente",  autor:"OrquestradorOutbound", texto:"A lista das 40 saiu de quem interagiu com os vídeos da semana. O outbound não começa do zero — ele pega carona no material que já foi gravado."},
    {tipo:"usuario", autor:"cliente", texto:"exato, é a mesma gravação servindo os dois lados"},
    {tipo:"agente",  autor:"OrquestradorOutbound", texto:"E o destino também é o mesmo: quem responde vai pra LP-diagnostico. Um bruto, um post, um criativo, uma mensagem, uma página."}
  ],
  "cadencia-de-mensagens/prospeccao-linkedin": [
    {tipo:"sistema", autor:"comando", texto:"Chat aberto · memória da sessão (1 anotação)"},
    {tipo:"agente",  autor:"ProspeccaoLinkedin", texto:"Separei as 40 contas por qual vídeo elas curtiram. A abordagem abre citando exatamente esse vídeo — anotei como <code>gatilho-de-abordagem</code>."}
  ],
  "cadencia-de-mensagens/copy-de-mensagem": [
    {tipo:"sistema", autor:"comando", texto:"Chat aberto · WIKI carregada · memória da sessão (2 anotações)"},
    {tipo:"agente",  autor:"CopyDeMensagem", texto:"4 mensagens por perfil de gancho, todas na mesma voz da WIKI. Nenhuma cita preço e nenhuma usa case não liberado."}
  ],

  "triagem-do-dia/orquestrador-inbox": [
    {tipo:"sistema", autor:"comando", texto:"Sessão contínua · não entra na régua da semana · roda todo dia"},
    {tipo:"agente",  autor:"OrquestradorInbox", texto:"Hoje: 34 DMs, 12 chats de LinkedIn e 19 e-mails. Os agentes já responderam 51 sozinhos usando a WIKI. <b>Sobraram 14 pra você</b>, todos com intenção de compra."},
    {tipo:"usuario", autor:"cliente", texto:"e apareceu alguma coisa que vira conteúdo?"},
    {tipo:"agente",  autor:"OrquestradorInbox", texto:"Sim. Três pessoas perguntaram a mesma coisa: como parar de ser o único que vende. Mandei isso pra curadoria de segunda — virou card no Kanban."},
    {tipo:"sistema", autor:"comando", texto:"Card criado em outro projeto: conteudo-e-criativos → «Levantar temas da semana — dor de operação» (segunda)"}
  ],
  "triagem-do-dia/triagem-de-dm": [
    {tipo:"sistema", autor:"comando", texto:"Chat aberto · WIKI carregada"},
    {tipo:"agente",  autor:"TriagemDeDm", texto:"Meu critério está em <code>criterio-de-passagem</code>: dúvida de conteúdo eu respondo, intenção de compra sobe pra você. Nada é apagado — o que eu respondi fica listado se você quiser conferir."}
  ],
  "triagem-do-dia/resposta-de-email": [
    {tipo:"sistema", autor:"comando", texto:"Chat aberto · WIKI carregada"},
    {tipo:"agente",  autor:"RespostaDeEmail", texto:"19 e-mails: 11 respondidos com a oferta de diagnóstico e o link da LP, 5 arquivados, 3 esperando você. Nenhum falou de preço."}
  ]
};

const MENSAGEM_PADRAO = [{tipo:"sistema", autor:"comando", texto:"Chat novo · nenhuma mensagem ainda"}];

/* ============ ESTADO DA TELA (so pintura) ============ */
let iProjeto = 0, iSessao = 0, iChat = 0, visao = "chat", iWiki = 0;

const $ = id => document.getElementById(id);
const projeto = () => PROJETOS[iProjeto];
const sessao  = () => projeto().sessoes[iSessao];
const chat    = () => sessao().chats[iChat];
const chaveMsg= () => sessao().nome + "/" + chat().nome;

const slug = txt => txt.toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,34);

/* ============ PINTURA: SIDEBAR ============ */
function pintarProjetos(){
  $("projeto-ativo").textContent = projeto().nome;
  $("lista-projetos").innerHTML = PROJETOS.map((p,i) =>
    `<div class="item ${i===iProjeto?"ativo":""}" data-projeto="${i}"
          style="border-left-color:var(--f-${p.fluxo})">
       ${p.nome}<span class="contagem">${p.sessoes.length}</span>
     </div>`).join("");
}

function pintarSessoes(){
  $("lista-sessoes").innerHTML = projeto().sessoes.map((s,i) =>
    `<div class="item ${i===iSessao?"ativo":""}" data-sessao="${i}">
       ${s.nome}<span class="contagem">${s.chats.length} chats</span>
     </div>`).join("");
}

/* ============ PINTURA: CHAT ============ */
function pintarOrigem(){
  const t = sessao().tarefa;
  $("origem").innerHTML = t
    ? `sessão aberta a partir do card &nbsp;<b>«${t}»</b>`
    : `sessão avulsa`;
}

function pintarAbas(){
  $("abas").innerHTML =
    sessao().chats.map((c,i) =>
      `<button class="aba ${i===iChat?"ativa":""}" data-chat="${i}">
         ${c.nome}<span class="papel">${c.papel}</span>
       </button>`).join("") +
    `<button class="aba aba-nova" title="novo chat">+</button>`;
}

function pintarChat(){
  const msgs = MENSAGENS[chaveMsg()] || MENSAGEM_PADRAO;
  $("visao-chat").innerHTML = msgs.map(m =>
    `<div class="msg ${m.tipo}">
       <span class="autor">${m.autor}</span>
       <span class="texto">${m.texto}</span>
     </div>`).join("");
}

function pintarMemoria(){
  const anotacoes = sessao().memoria;
  $("memoria").innerHTML = "<h3>MEMÓRIA DA SESSÃO</h3>" + (
    anotacoes.length
      ? anotacoes.map(a =>
          `<div class="anotacao">
             <span class="chave">${a.chave}</span>
             <span class="autor">por ${a.autor}</span>
             <span class="valor">${a.valor}</span>
           </div>`).join("")
      : `<div class="vazio">Nenhuma anotação ainda. O que os agentes desta sessão escreverem aparece aqui — e todo chat novo já nasce lendo isso.</div>`
  );
}

function pintarStatus(){
  $("caminho").textContent = `comercial-anexo / ${projeto().nome} / ${sessao().nome} / ${chat().nome}`;
  $("metricas").textContent =
    `| iterações: ${sessao().iteracoes} | memória: ${sessao().memoria.length} anotações`;
}

/* ============ PINTURA: KANBAN ============ */
function pintarCard(c, i){
  const temSessao = c.sess !== null && c.sess !== undefined;
  return `<div class="card ${c.fluxo} ${temSessao?"ativa-sessao":""}" data-card="${i}">
    ${c.t}
    ${c.selo ? `<span class="selo">${c.selo}</span>` : ""}
    ${c.elo  ? `<span class="elo">${c.elo}</span>`   : ""}
    <span class="rodape">
      <span class="dia">${c.dia}</span>
      <span class="abrir">${temSessao ? "retomar sessão →" : "abrir sessão →"}</span>
    </span>
  </div>`;
}

function pintarKanban(){
  const colunaHtml = nome => {
    const meus = CARDS.map((c,i)=>({c,i})).filter(o => o.c.col === nome);
    return `<div class="coluna">
      <div class="titulo"><span>${nome.toUpperCase()}</span><span>${meus.length}</span></div>
      ${meus.map(o => pintarCard(o.c, o.i)).join("")}
    </div>`;
  };

  $("visao-kanban").innerHTML = `
    <div class="quadro">
      <div class="legenda">
        <span>A gravação é o eixo — tudo é antes ou depois dela. Um card pode entrar em qualquer coluna: o que já está gravado pula direto para o pós.</span>
      </div>
      <div class="legenda">
        <span class="pino"><i class="bola" style="background:var(--f-conteudo)"></i>conteúdo</span>
        <span class="pino"><i class="bola" style="background:var(--f-midia)"></i>mídia paga</span>
        <span class="pino"><i class="bola" style="background:var(--f-cro)"></i>páginas / CRO</span>
        <span class="pino"><i class="bola" style="background:var(--f-outbound)"></i>outbound</span>
        <span class="pino"><i class="bola" style="background:var(--f-relacao)"></i>inbox e DM</span>
      </div>
      <div class="kanban">
        ${FAIXAS.map(f => `
          <div class="faixa ${f.eixo?"eixo":""}">
            <div class="rotulo-faixa">${f.nome}</div>
            <div class="colunas">${f.colunas.map(colunaHtml).join("")}</div>
          </div>`).join("")}
      </div>
    </div>`;
}

/* ============ PINTURA: SEMANA ============ */
function pintarSemana(){
  const miniHtml = (c,i) =>
    `<div class="mini ${c.fluxo}" data-card="${i}">${c.t}</div>`;

  const diaHtml = d => {
    const meus = CARDS.map((c,i)=>({c,i})).filter(o => o.c.dia === d.sigla);
    const corpo = d.acao === "kanban"
      ? `<div class="mini acao" data-ir="kanban">Manejar a semana no Kanban →</div>
         <div class="mini acao" data-ir="wiki">Revisar o acervo de gravações →</div>`
      : (meus.length
          ? meus.map(o => miniHtml(o.c, o.i)).join("")
          : `<div class="vazio" style="padding:4px">nada preso a este dia</div>`);
    return `<div class="dia-col ${d.eixo?"eixo":""} ${d.calmo?"calmo":""}">
      <div class="nome">${d.nome}${d.eixo?" · EIXO":""}</div>
      <div class="foco">${d.foco}</div>
      ${corpo}
    </div>`;
  };

  $("visao-semana").innerHTML = `
    <div class="semana">
      <div class="intro">
        A semana tem um ritmo, mas <b>não é uma fila</b>. A terça é o marco: o material gravado nela alimenta tanto as campanhas
        quanto o outbound. O que já está gravado entra depois da terça sem passar por ela.
      </div>
      <div class="regua-semana">${DIAS.map(diaHtml).join("")}</div>
      <div class="continuos">
        <div class="titulo">TODO DIA · FLUXOS CONTÍNUOS — não entram na régua, têm sessão sempre aberta</div>
        <div class="fila">
          ${CONTINUOS.map(c =>
            `<div class="mini ${c.fluxo}" data-continuo="${c.proj}-${c.sess}">${c.t}</div>`).join("")}
        </div>
      </div>
    </div>`;
}

/* ============ PINTURA: WIKI ============ */
function pintarWiki(){
  const p = WIKI[iWiki];
  $("visao-wiki").innerHTML = `
    <div class="wiki">
      <div class="wiki-indice">
        <div class="titulinho">WIKI DO AMBIENTE</div>
        ${WIKI.map((w,i) =>
          `<div class="pagina ${i===iWiki?"ativo":""}" data-wiki="${i}">${w.titulo}</div>`).join("")}
      </div>
      <div class="wiki-texto">
        <h2>${p.titulo}</h2>
        <div class="meta">${p.meta}</div>
        ${p.html}
      </div>
    </div>`;
}

/* ============ TROCA DE VISAO ============ */
function pintarVisao(){
  document.querySelectorAll(".visao").forEach(v => v.classList.add("escondido"));
  $("visao-" + visao).classList.remove("escondido");
  document.querySelectorAll(".visoes button").forEach(b =>
    b.classList.toggle("ativo", b.dataset.visao === visao));
}

function pintarTudo(){
  pintarProjetos(); pintarSessoes(); pintarOrigem(); pintarAbas();
  pintarChat(); pintarMemoria(); pintarStatus();
  pintarSemana(); pintarKanban(); pintarWiki();
  pintarVisao();
}

/* ============ A PONTE: card do Kanban -> sessao de trabalho ============ */
function irParaSessao(proj, sess){
  iProjeto = proj; iSessao = sess; iChat = 0; visao = "chat";
  $("caixa-projetos").classList.remove("aberta");
  pintarTudo();
}

function abrirSessaoDoCard(indice){
  const c = CARDS[indice];

  // ja existe sessao: so navega ate ela
  if (c.sess !== null && c.sess !== undefined) return irParaSessao(c.proj, c.sess);

  // nao existe: a tarefa vira sessao nova, com o orquestrador do projeto
  const p = PROJETOS[c.proj];
  const orq = p.orquestrador;
  const nova = {
    nome: slug(c.t),
    tarefa: c.t,
    iteracoes: 0,
    chats: [{nome: orq, papel: "orquestrador"}],
    memoria: []
  };
  p.sessoes.push(nova);
  c.sess = p.sessoes.length - 1;

  MENSAGENS[nova.nome + "/" + orq] = [
    {tipo:"sistema", autor:"comando",
     texto:`Sessão criada a partir do card «${c.t}» · WIKI do ambiente carregada · memória da sessão vazia`},
    {tipo:"agente", autor: orq,
     texto:`Peguei a tarefa <code>${c.t}</code>. Já estou com a oferta, o ICP, o tom de voz e o acervo de gravações da WIKI — você não precisa repetir nada disso. Me diz só o que muda nesta.`}
  ];

  irParaSessao(c.proj, c.sess);
}

/* ============ CLIQUES ============ */

// Semana / Kanban / WIKI: clicar de novo no botao aceso volta pro chat
document.querySelectorAll(".visoes button").forEach(botao => {
  botao.onclick = () => {
    visao = (visao === botao.dataset.visao) ? "chat" : botao.dataset.visao;
    pintarVisao();
  };
});

// abre e fecha o dropdown de projetos
$("btn-projetos").onclick = () => $("caixa-projetos").classList.toggle("aberta");

// escolher projeto: troca as sessoes junto e FECHA a caixa
$("lista-projetos").onclick = e => {
  const alvo = e.target.closest("[data-projeto]");
  if (!alvo) return;
  irParaSessao(+alvo.dataset.projeto, 0);
};

// escolher sessao: troca as abas de chat junto
$("lista-sessoes").onclick = e => {
  const alvo = e.target.closest("[data-sessao]");
  if (!alvo) return;
  irParaSessao(iProjeto, +alvo.dataset.sessao);
};

// escolher aba (= trocar de chat)
$("abas").onclick = e => {
  const alvo = e.target.closest("[data-chat]");
  if (!alvo) return;
  iChat = +alvo.dataset.chat;
  visao = "chat";
  pintarAbas(); pintarChat(); pintarStatus(); pintarVisao();
};

// clicar num card do Kanban abre (ou cria) a sessao daquela tarefa
$("visao-kanban").onclick = e => {
  const alvo = e.target.closest("[data-card]");
  if (!alvo) return;
  abrirSessaoDoCard(+alvo.dataset.card);
};

// a visao Semana mostra os mesmos cards por dia - e tambem leva a sessao
$("visao-semana").onclick = e => {
  const card = e.target.closest("[data-card]");
  if (card) return abrirSessaoDoCard(+card.dataset.card);

  const cont = e.target.closest("[data-continuo]");
  if (cont) {
    const [p,s] = cont.dataset.continuo.split("-").map(Number);
    return irParaSessao(p,s);
  }

  const ir = e.target.closest("[data-ir]");
  if (ir) { visao = ir.dataset.ir; pintarVisao(); }
};

// trocar de pagina da WIKI
$("visao-wiki").onclick = e => {
  const alvo = e.target.closest("[data-wiki]");
  if (!alvo) return;
  iWiki = +alvo.dataset.wiki;
  pintarWiki();
};

// liga/desliga o painel da memoria
$("btn-memoria").onclick = () => {
  const m = $("memoria");
  m.classList.toggle("escondida");
  $("btn-memoria").textContent =
    m.classList.contains("escondida") ? "mostrar memória" : "ocultar memória";
};

pintarTudo();
</script>

</body>
</html>
