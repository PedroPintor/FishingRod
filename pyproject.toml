[project]
name = "fishingrod"
version = "0.1.0"
description = "Ambiente de orquestracao multi-agente"
requires-python = ">=3.14"
# U6 (sessao): claude-agent-sdk e a unica dependencia direta de runtime
# (NFR-S-01). Versao exata (NFR-S-02, TS-S-01): a 0.2.143 e a ultima com pacote
# Windows, com o CLI 2.1.238 embutido, antes do corte de exclude-newer - e a
# sessao usa esse CLI, nunca o do PATH (TS-S-02).
# So adaptadores/sessao/ importa o SDK: dominio/ e aplicacao/ continuam
# importando sem ele, e tests/sessao/test_fronteira.py prova isso num Python
# com o import bloqueado (TD-02, NFR-S-07).
# A textual entrou com a primeira tela (card 001), tambem em versao exata: a
# ultima antes do corte de exclude-newer. So interface/ a importa.
dependencies = [
    "claude-agent-sdk==0.2.143",
    "textual==8.2.8",
]

[project.scripts]
fishingrod = "fishingrod.interface.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Empacota somente o pacote novo. O codigo atual da raiz (Ambiente/, model/,
# cli.py, tui.py) coexiste sem ser recolhido pelo build (Q8=A).
packages = ["src/fishingrod"]

[tool.uv]
# ESC-15: politica de idade minima de versao. Congela o universo de resolucao
# para que o uv.lock seja reprodutivel.
exclude-newer = "2026-08-25T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
# DP-S-24, NFR-S-08: os testes com o CLI do Claude de verdade gastam o limite
# da assinatura e ficam fora da suite padrao - aparecem como deselected, nao
# como skipped. Rodam com `uv run pytest -m sdk_real`.
markers = [
    "sdk_real: usa o CLI do Claude de verdade; fora da suite padrao",
]
addopts = "-m 'not sdk_real'"
